---
version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  allow:
  # Allow both direct and indirect updates for all packages
  - dependency-type: "all"
  # group all minor and patch dependency updates together
  groups:
    go-modules:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
  cooldown:
    default-days: 7
- package-ecosystem: gomod
  directory: "/dependency/retrieval"
  schedule:
    interval: daily
  ignore:
  # packit v2.26.0 added a MarshalJSON that drops "target" from libdependency
  # output. Remove once libdependency handles it.
  - dependency-name: "github.com/paketo-buildpacks/packit/v2"
    versions: [">=2.26.0"]
  allow:
  # Allow both direct and indirect updates for all packages
  - dependency-type: "all"
  # group all minor and patch dependency updates together
  groups:
    go-modules:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
  cooldown:
    default-days: 7
